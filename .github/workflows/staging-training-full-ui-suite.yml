name: Staging Training module — full UI regression suite

# Write-capable. Unlike staging-training-review.yml (browse-only), this
# creates, edits and deletes its own throwaway fixtures through the real app
# UI — see docs/testing/MODULE-UI-TESTING-STANDARD.md for the standing
# process this workflow follows (it is the first module built to that
# standard). Requires a typed confirmation phrase so it is never triggered
# by accident; manual workflow_dispatch only, same as every other
# write-capable staging workflow in this repo.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN STAGING TRAINING FULL UI SUITE to create, exercise and delete throwaway Training fixtures in Staging'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-training-full-ui-suite
  cancel-in-progress: false

jobs:
  training-full-ui-suite:
    name: Run the Training module full UI regression suite against Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_STAGING_TRAINING_EMAIL: ${{ secrets.E2E_STAGING_TRAINING_EMAIL }}
      E2E_STAGING_TRAINING_PASSWORD: ${{ secrets.E2E_STAGING_TRAINING_PASSWORD }}
      E2E_STAGING_HEIGHT_READONLY_EMAIL: ${{ secrets.E2E_STAGING_HEIGHT_READONLY_EMAIL }}
      E2E_STAGING_HEIGHT_READONLY_PASSWORD: ${{ secrets.E2E_STAGING_HEIGHT_READONLY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate confirmation and dedicated staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'RUN STAGING TRAINING FULL UI SUITE' || {
            echo 'Confirmation must be exactly: RUN STAGING TRAINING FULL UI SUITE' >&2
            exit 1
          }
          test -n "${E2E_STAGING_TRAINING_EMAIL:-}" || { echo 'Missing E2E_STAGING_TRAINING_EMAIL in the staging environment.' >&2; exit 1; }
          test -n "${E2E_STAGING_TRAINING_PASSWORD:-}" || { echo 'Missing E2E_STAGING_TRAINING_PASSWORD in the staging environment.' >&2; exit 1; }
          test -n "${E2E_STAGING_HEIGHT_READONLY_EMAIL:-}" || { echo 'Missing E2E_STAGING_HEIGHT_READONLY_EMAIL in the staging environment.' >&2; exit 1; }
          test -n "${E2E_STAGING_HEIGHT_READONLY_PASSWORD:-}" || { echo 'Missing E2E_STAGING_HEIGHT_READONLY_PASSWORD in the staging environment.' >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked test tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download latest isolated Staging app bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=spray-wash-staging-app&per_page=100" --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')"
          test -n "$artifact_id" || { echo 'No current spray-wash-staging-app artifact exists. Run Build staging app first.' >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > staging-app.zip
          mkdir staging-app
          unzip -q staging-app.zip -d staging-app
          test -f staging-app/index.html
          test -f staging-app/config.js
          test -f staging-app/STAGING-README.txt
          ref="$(sed -n 's/^Supabase project ref: //p' staging-app/STAGING-README.txt | head -n 1)"
          test -n "$ref" || { echo 'Staging artifact has no project ref.' >&2; exit 1; }
          test "$ref" != 'twkgfmctuffmkvkmdkct' || { echo 'SAFETY STOP: staging artifact identifies production.' >&2; exit 1; }
          ! grep -F 'twkgfmctuffmkvkmdkct' staging-app/config.js >/dev/null || { echo 'SAFETY STOP: staging artifact config references production.' >&2; exit 1; }
      - name: Serve the isolated Staging app and run the full UI suite
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install http-server staging-app -p 4174 -c-1 > staging-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          E2E_STAGING_BASE_URL=http://127.0.0.1:4174 npm run test:staging:training-full-suite
      - name: Publish full-suite run status
        if: ${{ always() }}
        run: |
          echo '## Staging Training module — full UI regression suite' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Exercised every create/edit/toggle/delete action a Training manager can take through the real rendered UI (course catalog, contractors, people, the training matrix, records, evidence files, the on-screen and printable register) and verified a Training-role-gate negative case, all through a self-contained, run-tagged fixture set.' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Two tests are *known-bug regressions* and are expected to fail until Brendan gives the go-ahead to fix them (see the combined code-audit + suite report): TRAINING-SUITE-003 (My Training has no server-side row filter) and TRAINING-SUITE-015 (a Failed record is coloured/signalled as if only "In progress").' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'This run creates and deletes its own fixtures every time — see the afterAll step in training-full-ui-suite.spec.cjs. Anything still in Staging tagged `E2E-UI-SUITE-TRAINING-` after a run means that run was interrupted before its own cleanup finished; it is always safe to remove by hand. Production was refused and not accessed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-training-full-ui-suite-failure-evidence
          path: |
            playwright-report/
            test-results/
            staging-http-server.log
          if-no-files-found: warn
          retention-days: 14
