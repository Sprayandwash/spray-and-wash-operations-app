name: Deploy notification functions to staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY NOTIFICATION FUNCTIONS TO STAGING
        required: true
      source_branch:
        description: Branch holding the function code
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: twkgfmctuffmkvkmdkct
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
      - name: Validate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY NOTIFICATION FUNCTIONS TO STAGING"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy notification-control and employee-notifications to staging only
        run: |
          set -euo pipefail
          ref="$(supabase projects list --output json | jq -r '.[] | select(.name=="Spray and Wash Staging") | (.id // .ref)')"
          test -n "$ref" && test "$ref" != "$PRODUCTION_PROJECT_REF"
          supabase functions deploy notification-control --project-ref "$ref" --yes
          supabase functions deploy employee-notifications --project-ref "$ref" --yes
